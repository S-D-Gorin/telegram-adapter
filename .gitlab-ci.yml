stages:
  - mirror
  - build

mirror-to-github:
  stage: mirror
  image: alpine:3.20
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
    - echo >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
    - ssh-keyscan github.com > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:S-D-Gorin/telegram-adapter.git
    - git push github HEAD:refs/heads/main

build-docker:
  stage: build
  image: docker:cli
  tags:
    - docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build
        -t "sdg9999/sprotectbots-telegram-adapter:latest"
        -t "sdg9999/sprotectbots-telegram-adapter:${CI_COMMIT_SHORT_SHA}"
        .
    - docker push "sdg9999/sprotectbots-telegram-adapter:latest"
    - docker push "sdg9999/sprotectbots-telegram-adapter:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    