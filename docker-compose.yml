services:
  telegram-adapter:
    image: sprotectbots/telegram-adapter:latest
    build: .
    restart: unless-stopped
    environment:
      SERVER_API: ${SERVER_API}
      BOT_TOKEN: ${BOT_TOKEN}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - telegram-adapter-data:/data
    networks:
      - default
      - receiver-backend

volumes:
  telegram-adapter-data:

networks:
  receiver-backend:
    external: true
    name: sprotect-v3_receiver-backend