services:
  telegram-adapter:
    image: sprotectbots/telegram-adapter:0.2.0
    build: .
    restart: unless-stopped
    environment:
      SERVER_API: ${SERVER_API}
      BOT_TOKEN: ${BOT_TOKEN}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_DELIVERY_CONCURRENCY: ${EVENT_DELIVERY_CONCURRENCY:-8}
      EVENT_MAX_ATTEMPTS: ${EVENT_MAX_ATTEMPTS:-5}
      EVENT_PENDING_TTL_SECONDS: ${EVENT_PENDING_TTL_SECONDS:-172800}
      EVENT_RETENTION_SECONDS: ${EVENT_RETENTION_SECONDS:-172800}
      EVENT_MAX_PENDING: ${EVENT_MAX_PENDING:-10000}
    volumes:
      - telegram-adapter-data:/data

volumes:
  telegram-adapter-data:
